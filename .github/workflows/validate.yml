name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate LunaDash SDK packages
        run: python3 scripts/validate.py
      - name: Check source-only policy
        run: python3 scripts/check_safety.py
      - name: Enforce one-plugin PR scope
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_scope.py
      - name: Verify committed catalogue
        if: github.event_name == 'push'
        run: python3 scripts/build_index.py --check

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: Install website dependencies
        working-directory: site
        run: npm install
      - name: Check Astro
        working-directory: site
        run: npm run check
      - name: Build Astro
        working-directory: site
        run: npm run build
